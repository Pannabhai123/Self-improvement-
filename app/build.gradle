plugins {
    id 'com.android.application'
}

android {
    namespace 'com.focuslife.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.focuslife.app"
        // Android 10 (API 29) is the floor required by the project brief.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Hindi + English ship in the same APK; no split needed for two locales.
        resourceConfigurations += ["en", "hi"]

        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString(),
                              "room.incremental"   : "true"]
            }
        }
    }

    signingConfigs {
        // Optional release signing. The CI job injects these from repository secrets;
        // if they are absent the release build simply stays unsigned and the debug
        // APK (auto-signed with the debug key) is the installable artifact.
        release {
            def ks = System.getenv("FOCUSLIFE_KEYSTORE_PATH")
            if (ks != null && file(ks).exists()) {
                storeFile     file(ks)
                storePassword System.getenv("FOCUSLIFE_STORE_PASSWORD")
                keyAlias      System.getenv("FOCUSLIFE_KEY_ALIAS")
                keyPassword   System.getenv("FOCUSLIFE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            minifyEnabled false
            // Debug builds are what CI publishes as the installable APK.
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
        // AGP 8 stopped generating BuildConfig unless it is asked for, and the
        // Profile tab shows BuildConfig.VERSION_NAME. Without this line the class
        // does not exist and compilation fails.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }

    // Room ships its own schemas; keep lint from failing the build on informational issues.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Gradle's default test task prints nothing about individual failures beyond
// "there were failing tests, see the report", and the HTML report is not readable
// from a CI annotation. Naming the failing test and its assertion on the console
// is the difference between a diagnosable run and a blind one.
tasks.withType(Test).configureEach {
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showCauses true
        showStackTraces false
    }
    // Four workers would be the default on a 2-core runner; one JVM is enough for
    // a few hundred pure-JVM assertions and keeps the log interleaving readable.
    maxParallelForks 1
}

dependencies {
    // ---------- Core UI ----------
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.preference:preference:1.2.1'

    // ---------- Lifecycle / async ----------
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.4'

    // ---------- Local database (offline-first) ----------
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ---------- Battery-efficient background work ----------
    implementation 'androidx.work:work-runtime:2.9.1'

    // ---------- Unit tests (JVM only; run in CI without an emulator) ----------
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
}
