# ---- JVM ----
# Kept deliberately modest: this project also builds on 4 GB CI runners and on
# low-RAM developer machines. 1.5 GB heap is ample for a single-module app.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ---- Build performance ----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ---- APK size / RAM footprint ----
# Resource shrinking is enabled per-variant in app/build.gradle.
android.enableR8.fullMode=false
